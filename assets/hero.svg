    <rect width="150" height="42" rx="21" fill="#22D3EE" fill-opacity="0.09" stroke="#67E8F9" stroke-opacity="0.5"/>
    <circle cx="24" cy="21" r="4" fill="#67E8F9"/>
    <text x="39" y="26" fill="#A5F3FC">AI AGENTS</text>

    <g transform="translate(166)">
      <rect width="190" height="42" rx="21" fill="#34D399" fill-opacity="0.08" stroke="#6EE7B7" stroke-opacity="0.45"/>
      <circle cx="24" cy="21" r="4" fill="#6EE7B7"/>
      <text x="39" y="26" fill="#A7F3D0">DEVELOPER TOOLS</text>
