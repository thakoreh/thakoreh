    <text x="1128" y="62" text-anchor="end" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" letter-spacing="2">TORONTO / CA</text>
  </g>

  <g transform="translate(78 108)">
    <text x="0" y="0" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="600" letter-spacing="4">SOFTWARE ENGINEER / PRODUCT BUILDER</text>
    <text x="0" y="78" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="76" font-weight="800" letter-spacing="-3">HIREN THAKORE</text>
    <rect x="0" y="101" width="645" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="0" y="154" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="25" font-weight="450">I build software that makes AI useful.</text>
  </g>

